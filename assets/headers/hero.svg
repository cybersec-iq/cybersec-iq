<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-labelledby="heroTitle heroDesc" preserveAspectRatio="xMidYMid meet">
  <title id="heroTitle">Aryan IQ — Full-Stack, Cybersecurity, AI Systems, Automation</title>
  <desc id="heroDesc">Dark cyberpunk header showing the name ARYAN IQ over a technical grid, with a shield mark, an ambient network constellation, and a status line reading Muscat Oman, status building, nothing is impossible.</desc>

  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E13"/><stop offset="55%" stop-color="#05070A"/><stop offset="100%" stop-color="#070C11"/>
    </linearGradient>
    <linearGradient id="hName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14"/><stop offset="52%" stop-color="#C6FF00"/><stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="hRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.9"/><stop offset="55%" stop-color="#00E5FF" stop-opacity="0.45"/><stop offset="100%" stop-color="#2979FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hSweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0"/><stop offset="50%" stop-color="#39FF14" stop-opacity="0.26"/><stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1B2733" stroke-width="1"/></pattern>
    <pattern id="hScan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00E5FF" opacity="0.05"/></pattern>
    <radialGradient id="hVig" cx="28%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#0F1A16" stop-opacity="0.8"/><stop offset="100%" stop-color="#05070A" stop-opacity="0.98"/>
    </radialGradient>
    <filter id="hGlow" x="-25%" y="-60%" width="150%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hSoft" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="hClip"><rect x="0" y="0" width="900" height="290" rx="3"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "Fira Code", "SFMono-Regular", Menlo, Consolas, monospace; }
      .sweep  { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
      .caret  { animation: caret 1.1s steps(1) infinite; }
      .pulseA { animation: pulse 3.4s ease-in-out infinite; }
      .pulseB { animation: pulse 3.4s ease-in-out infinite; animation-delay: -1.1s; }
      .pulseC { animation: pulse 3.4s ease-in-out infinite; animation-delay: -2.2s; }
      .flow   { stroke-dasharray: 5 9; animation: flow 3s linear infinite; }
      .live   { animation: live 2.6s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateY(-80px); } 60%,100% { transform: translateY(330px); } }
      @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -28; } }
      @keyframes live  { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .sweep,.caret,.pulseA,.pulseB,.pulseC,.flow,.live { animation: none; } .sweep { opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#hClip)">
    <rect width="900" height="290" fill="url(#hBg)"/>
    <rect width="900" height="290" fill="url(#hGrid)" opacity="0.55"/>
    <rect width="900" height="290" fill="url(#hVig)"/>
    <rect width="900" height="290" fill="url(#hScan)"/>
    <rect class="sweep" x="0" y="0" width="900" height="70" fill="url(#hSweep)"/>

    <!-- ambient network constellation (upper right, clear of all type) -->
    <g transform="translate(614 26)" opacity="0.85">
      <g stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.32">
        <path class="flow" d="M26 116 L88 44"/><path class="flow" d="M88 44 L168 78"/>
        <path class="flow" d="M168 78 L130 142"/><path class="flow" d="M130 142 L26 116"/>
        <path class="flow" d="M88 44 L130 142"/><path class="flow" d="M168 78 L216 18"/>
        <path class="flow" d="M26 116 L6 34"/><path class="flow" d="M130 142 L206 132"/>
      </g>
      <g fill="#39FF14" filter="url(#hSoft)" opacity="0.5"><circle cx="88" cy="44" r="5"/><circle cx="130" cy="142" r="5"/></g>
      <g fill="#39FF14"><circle class="pulseA" cx="88" cy="44" r="3.4"/><circle class="pulseC" cx="130" cy="142" r="3.4"/></g>
      <g fill="#00E5FF"><circle class="pulseB" cx="168" cy="78" r="3.4"/><circle class="pulseA" cx="26" cy="116" r="3.4"/></g>
      <g fill="#C6FF00" opacity="0.75"><circle class="pulseC" cx="216" cy="18" r="2.4"/><circle class="pulseB" cx="6" cy="34" r="2.4"/><circle class="pulseA" cx="206" cy="132" r="2.4"/></g>
    </g>

    <!-- shield mark -->
    <g transform="translate(44 96)">
      <path d="M26 0 L52 10 V31 C52 46 40 57 26 63 C12 57 0 46 0 31 V10 Z" fill="none" stroke="#39FF14" stroke-width="1.6" opacity="0.75"/>
      <path d="M26 7 L44 14 V31 C44 42 36 50 26 55 C16 50 8 42 8 31 V14 Z" fill="#39FF14" opacity="0.07"/>
      <path d="M16 31 l7 8 l15 -17" fill="none" stroke="#C6FF00" stroke-width="2.4" stroke-linecap="square"/>
    </g>

    <g class="mono">
      <text x="112" y="76" fill="#00E5FF" font-size="14" letter-spacing="5.5" opacity="0.82">SYSTEM // OPERATOR</text>
      <g filter="url(#hGlow)">
        <text x="110" y="152" fill="url(#hName)" font-size="62" font-weight="700" letter-spacing="5">ARYAN IQ</text>
      </g>
      <rect class="caret" x="462" y="115" width="13" height="45" fill="#39FF14" opacity="0.9"/>
      <rect x="112" y="176" width="500" height="1.5" fill="url(#hRule)"/>
      <text x="112" y="211" fill="#D7E3EC" font-size="17" letter-spacing="2.4">FULL-STACK<tspan fill="#39FF14" dx="9">•</tspan><tspan dx="9">CYBERSECURITY</tspan><tspan fill="#39FF14" dx="9">•</tspan><tspan dx="9">AI SYSTEMS</tspan><tspan fill="#39FF14" dx="9">•</tspan><tspan dx="9">AUTOMATION</tspan></text>
      <g transform="translate(112 250)" font-size="13.5" letter-spacing="2">
        <circle class="live" cx="4" cy="-5" r="4" fill="#39FF14"/>
        <text x="20" y="0" fill="#7C8B99">MUSCAT, OMAN</text>
        <text x="196" y="0" fill="#1B2733">|</text>
        <text x="216" y="0" fill="#7C8B99">STATUS: BUILDING</text>
        <text x="440" y="0" fill="#1B2733">|</text>
        <text x="460" y="0" fill="#C6FF00">NOTHING IS IMPOSSIBLE</text>
      </g>
    </g>

    <g stroke="#39FF14" stroke-width="2" fill="none" opacity="0.7">
      <path d="M16 38 V16 H38"/><path d="M862 16 H884 V38"/>
      <path d="M16 252 V274 H38"/><path d="M862 274 H884 V252"/>
    </g>
    <rect x="0.75" y="0.75" width="898.5" height="288.5" rx="3" fill="none" stroke="#1B2733" stroke-width="1.5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 442" width="1200" height="442" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">Play Snake - snake protocol</title>
  <desc id="d">Play Snake. Interactive console. A real, playable Snake: original build, no framework, no trackers, no dependencies. Controls: arrows or WASD to move, space or P to pause, R to restart. Board 21 by 21. High score stored locally in the browser. Hosted on GitHub Pages.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12242E" stroke-width="1"/>
    </pattern>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0B1820" stroke-width="0.7"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00E5FF" opacity="0.035"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A23"/><stop offset="100%" stop-color="#050D13"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-35%" y="-70%" width="170%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Space Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .live  { animation: live 2.8s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 8; animation: flow 3.2s linear infinite; }
      .rise  { animation: rise .55s ease-out both; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes live  { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(7px); }
                          to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .live, .flow, .rise { animation: none; }
      }
    </style>
  </defs>
  <g class="m">
    <rect width="1200" height="442" fill="#03070A"/>
    <rect width="1200" height="442" fill="url(#grid)" opacity="0.5"/>
    <rect width="1200" height="442" fill="url(#scan)"/>
    <rect x="22" y="20" width="1156" height="402" rx="4" fill="#050D13" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <g stroke="#FFE600" stroke-width="2.2" fill="none" opacity="0.85"><path d="M22 40 V20 H42"/><path d="M1158 20 H1178 V40"/></g>
    <text x="64" y="66" font-size="13.5" fill="#00E5FF" letter-spacing="3.6">// INTERACTIVE CONSOLE</text>
    <g transform="translate(64 82) scale(1.8333)" fill="none" stroke="#39FF14" stroke-width="1.31" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M3 18 h5 v-5 h5 v-5 h5" stroke-width="2.6"/><rect x="17.5" y="6" width="4" height="4" fill="#39FF14" stroke="none"/></g>
    <text x="124" y="128" font-size="54" fill="#39FF14" font-weight="700" letter-spacing="3" filter="url(#glowLg)">PLAY SNAKE</text>
    <text x="64" y="162" font-size="16" fill="#EAF2F7" letter-spacing="0.4">Challenge the terminal. Beat the system.</text>
    <rect x="64" y="186" width="470" height="62" rx="3" fill="#04170A" fill-opacity="1.0" stroke="#39FF14" stroke-width="2"/>
    <rect x="69" y="191" width="460" height="52" rx="3" fill="none" fill-opacity="0" stroke="#39FF14" stroke-width="1"/>
    <g transform="translate(90 205.0) scale(1.0000)" fill="none" stroke="#39FF14" stroke-width="1.90" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M7 4.5 L19 12 L7 19.5 Z"/></g>
    <text x="140" y="225.0" font-size="21" fill="#39FF14" font-weight="700" letter-spacing="9" filter="url(#glowSm)">PLAY SNAKE</text>
    <path d="M494 209 l8 8 l-8 8" fill="none" stroke="#39FF14" stroke-width="2.4" stroke-linecap="square"/>
    <text x="64" y="278" font-size="13.5" fill="#6E828F">A real, playable Snake — original build, no framework,</text>
    <text x="64" y="297" font-size="13.5" fill="#6E828F">no trackers, no dependencies.</text>
    <g transform="translate(64 316) scale(0.7083)" fill="none" stroke="#39FF14" stroke-width="2.68" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M9 6 L3.5 12 L9 18"/><path d="M15 6 L20.5 12 L15 18"/></g>
    <text x="90" y="330" font-size="14" fill="#2979FF">cybersec-iq.github.io/cybersec-iq</text>
    <text x="381.2" y="330" font-size="13" fill="#6E828F">— command center</text>
    <text x="90" y="351" font-size="14" fill="#2979FF">/snake</text>
    <text x="154.4" y="351" font-size="13" fill="#6E828F">— SNAKE PROTOCOL</text>
    <rect x="582" y="54" width="554" height="334" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <text x="606" y="84" font-size="14" fill="#EAF2F7" font-weight="600" letter-spacing="2">SNAKE PROTOCOL</text>
    <circle cx="1052" cy="79" r="4" fill="#39FF14" class="live"/>
    <text x="1066" y="84" font-size="12" fill="#39FF14" letter-spacing="1.8">LIVE</text>
    <rect x="606" y="98" width="506" height="1" fill="#1B3541"/>
    <text x="606" y="124" font-size="12" fill="#00E5FF" letter-spacing="2.4">// CONTROLS</text>
    <text x="606" y="150" font-size="13" fill="#00E5FF" letter-spacing="0.8">ARROWS / WASD</text>
    <text x="792" y="150" font-size="13" fill="#C3CDD6" letter-spacing="1.6">MOVE</text>
    <text x="606" y="176" font-size="13" fill="#00E5FF" letter-spacing="0.8">SPACE or P</text>
    <text x="792" y="176" font-size="13" fill="#C3CDD6" letter-spacing="1.6">PAUSE</text>
    <text x="606" y="202" font-size="13" fill="#00E5FF" letter-spacing="0.8">R</text>
    <text x="792" y="202" font-size="13" fill="#C3CDD6" letter-spacing="1.6">RESTART</text>
    <text x="606" y="256" font-size="12" fill="#00E5FF" letter-spacing="2.4">// PROPERTIES</text>
    <text x="606" y="282" font-size="12" fill="#6E828F" letter-spacing="1.4">BOARD</text>
    <text x="792" y="282" font-size="12" fill="#DFFF00" letter-spacing="1.2">21 x 21</text>
    <text x="606" y="306" font-size="12" fill="#6E828F" letter-spacing="1.4">DEPENDENCIES</text>
    <text x="792" y="306" font-size="12" fill="#DFFF00" letter-spacing="1.2">NONE</text>
    <text x="606" y="330" font-size="12" fill="#6E828F" letter-spacing="1.4">TRACKERS</text>
    <text x="792" y="330" font-size="12" fill="#DFFF00" letter-spacing="1.2">NONE</text>
    <text x="606" y="354" font-size="12" fill="#6E828F" letter-spacing="1.4">HIGH SCORE</text>
    <text x="792" y="354" font-size="12" fill="#DFFF00" letter-spacing="1.2">STORED LOCALLY</text>
    <rect x="922" y="116" width="182" height="224" rx="3" fill="#020A06" fill-opacity="1.0" stroke="#39FF14" stroke-width="1.2"/>
    <g stroke="#39FF14" stroke-width="1.6" fill="none" opacity="0.6"><path d="M922 128 V116 H934"/><path d="M1092 116 H1104 V128"/><path d="M922 328 V340 H934"/><path d="M1092 340 H1104 V328"/></g>
    <g stroke="#0C3A08" stroke-width="0.7" opacity="0.5"><path d="M933.4 116 V340"/><path d="M944.8 116 V340"/><path d="M956.1 116 V340"/><path d="M967.5 116 V340"/><path d="M978.9 116 V340"/><path d="M990.2 116 V340"/><path d="M1001.6 116 V340"/><path d="M1013.0 116 V340"/><path d="M1024.4 116 V340"/><path d="M1035.8 116 V340"/><path d="M1047.1 116 V340"/><path d="M1058.5 116 V340"/><path d="M1069.9 116 V340"/><path d="M1081.2 116 V340"/><path d="M1092.6 116 V340"/><path d="M922 136.4 H1104"/><path d="M922 156.7 H1104"/><path d="M922 177.1 H1104"/><path d="M922 197.5 H1104"/><path d="M922 217.8 H1104"/><path d="M922 238.2 H1104"/><path d="M922 258.5 H1104"/><path d="M922 278.9 H1104"/><path d="M922 299.3 H1104"/><path d="M922 319.6 H1104"/></g>
    <g fill="#39FF14"><rect x="946.2" y="280.4" width="8.4" height="8.4" opacity="0.55"/><rect x="957.6" y="280.4" width="8.4" height="8.4" opacity="0.58"/><rect x="969.0" y="280.4" width="8.4" height="8.4" opacity="0.61"/><rect x="980.4" y="280.4" width="8.4" height="8.4" opacity="0.65"/><rect x="991.8" y="280.4" width="8.4" height="8.4" opacity="0.68"/><rect x="1003.1" y="280.4" width="8.4" height="8.4" opacity="0.71"/><rect x="1014.5" y="280.4" width="8.4" height="8.4" opacity="0.74"/><rect x="1025.9" y="280.4" width="8.4" height="8.4" opacity="0.78"/><rect x="1037.2" y="280.4" width="8.4" height="8.4" opacity="0.81"/><rect x="1037.2" y="260.0" width="8.4" height="8.4" opacity="0.84"/><rect x="1037.2" y="239.7" width="8.4" height="8.4" opacity="0.87"/><rect x="1037.2" y="219.3" width="8.4" height="8.4" opacity="0.90"/><rect x="1048.6" y="219.3" width="8.4" height="8.4" opacity="0.94"/><rect x="1060.0" y="219.3" width="8.4" height="8.4" opacity="0.97"/><rect x="1071.4" y="219.3" width="8.4" height="8.4" opacity="1.00"/></g>
    <rect x="1071.4" y="219.3" width="8.4" height="8.4" fill="#DFFF00" filter="url(#glowSm)"/>
    <rect x="980.4" y="158.2" width="8.4" height="8.4" fill="#FFE600" class="live" filter="url(#glowSm)"/>
  </g>
</svg>

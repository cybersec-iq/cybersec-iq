<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="900" height="412" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">whoami - Aryan IQ</title>
  <desc id="d">Terminal identity panel. Prompt cybersec-iq at github, tilde profile, command whoami. Output ARYAN IQ. Full-stack developer, cybersecurity, AI systems builder. Location Muscat, Oman. Status building. Mission nothing is impossible.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12242E" stroke-width="1"/>
    </pattern>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0B1820" stroke-width="0.7"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00E5FF" opacity="0.035"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A23"/><stop offset="100%" stop-color="#050D13"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-35%" y="-70%" width="170%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type-whoami-wide">
      <rect x="112" y="133" width="54.6" height="20.2">
        <animate attributeName="width" values="54.6;54.6;0.0;0.0;9.1;18.2;27.3;36.4;45.5;54.6;54.6;54.6;54.6" keyTimes="0.000;0.010;0.011;0.080;0.088;0.096;0.104;0.112;0.120;0.128;0.780;0.960;1.000" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Space Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .live  { animation: live 2.8s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 8; animation: flow 3.2s linear infinite; }
      .rise  { animation: rise .55s ease-out both; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes live  { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(7px); }
                          to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .live, .flow, .rise { animation: none; }
      }
    </style>
  </defs>
  <g class="m">
    <rect width="900" height="412" fill="#03070A"/>
    <rect width="900" height="412" fill="url(#grid)" opacity="0.5"/>
    <rect width="900" height="412" fill="url(#scan)"/>
    <text x="24" y="28" font-size="17" fill="#00E5FF" font-weight="600" letter-spacing="0.4">~/whoami</text>
    <rect x="22" y="42" width="856" height="322" rx="4" fill="#050D13" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="22" y="42" width="856" height="46" rx="3" fill="#0B1A23" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.1"/>
    <circle cx="44" cy="65.0" r="5.2" fill="#FF5F57"/>
    <circle cx="61" cy="65.0" r="5.2" fill="#FEBC2E"/>
    <circle cx="78" cy="65.0" r="5.2" fill="#28C840"/>
    <text x="103" y="69.42" font-size="13" fill="#C3CDD6" letter-spacing="0.35">bash — cybersec-iq — 96×24</text>
    <circle cx="788.7" cy="65.0" r="4" fill="#39FF14" class="live"/>
    <text x="801.7" y="69.42" font-size="13" fill="#39FF14" font-weight="600" letter-spacing="1.5" filter="url(#glowSm)">ONLINE</text>
    <rect x="22" y="88" width="856" height="1" fill="#284653"/>
    <g stroke="#39FF14" stroke-width="1.6" fill="none" opacity="0.62"><path d="M22 347 V364 H39"/><path d="M861 364 H878 V347"/></g>
    <text x="64" y="122" font-size="15" fill="#39FF14" font-weight="600" letter-spacing="0.15">╭─(cybersec-iq ◉ github)-[ ~/profile ]</text>
    <text x="64" y="148" font-size="15" fill="#39FF14" font-weight="600">╰─$</text>
    <text x="112" y="148" font-size="15" fill="#EAF2F7" font-weight="600" letter-spacing="0.1" style="clip-path:url(#type-whoami-wide)">whoami</text>
    <rect x="170.6" y="135.0" width="7.2" height="15.8" fill="#39FF14" class="blink" filter="url(#glowSm)"><animate attributeName="x" values="166.6;166.6;112.0;112.0;121.1;130.2;139.3;148.4;157.5;166.6;166.6;166.6;166.6" keyTimes="0.000;0.010;0.011;0.080;0.088;0.096;0.104;0.112;0.120;0.128;0.780;0.960;1.000" dur="12s" calcMode="discrete" repeatCount="indefinite"/></rect>
    <text x="64" y="202" font-size="56" fill="#39FF14" font-weight="700" letter-spacing="3.2" filter="url(#glowMd)">ARYAN</text>
    <text x="268.8" y="202" font-size="56" fill="#48FF24" font-weight="700" letter-spacing="3.2" filter="url(#glowMd)">IQ</text>
    <text x="64" y="236" font-size="13.2" fill="#C3CDD6" xml:space="preserve" letter-spacing="1.45">FULL-STACK DEVELOPER  /  CYBERSECURITY  /  AI SYSTEMS BUILDER</text>
    <rect x="64" y="254" width="772" height="1.5" fill="url(#ruleGreen)"/>
    <text x="64" y="287" font-size="15.5" fill="#00E5FF" letter-spacing="2.1">LOCATION</text>
    <text x="188" y="287" font-size="15.5" fill="#3A4C58">:</text>
    <text x="215" y="287" font-size="15.5" fill="#EAF2F7" font-weight="600" letter-spacing="1.15">MUSCAT, OMAN</text>
    <text x="64" y="318" font-size="15.5" fill="#00E5FF" letter-spacing="2.1">STATUS</text>
    <text x="188" y="318" font-size="15.5" fill="#3A4C58">:</text>
    <text x="215" y="318" font-size="15.5" fill="#FFE600" font-weight="600" letter-spacing="1.15">BUILDING</text>
    <circle cx="314.45" cy="313" r="4" fill="#FFE600" class="live"/>
    <text x="64" y="349" font-size="15.5" fill="#00E5FF" letter-spacing="2.1">MISSION</text>
    <text x="188" y="349" font-size="15.5" fill="#3A4C58">:</text>
    <text x="215" y="349" font-size="15.5" fill="#39FF14" font-weight="600" letter-spacing="1.15">NOTHING IS IMPOSSIBLE</text>
    <rect x="64" y="390" width="772" height="1" fill="#1B3541"/>
    <rect x="64" y="390" width="370.56" height="1" fill="#1B7A10"/>
    <rect x="465.44" y="390" width="370.56" height="1" fill="#0A6C7C"/>
    <rect x="445.0" y="385" width="10" height="10" transform="rotate(45 450.0 390)" fill="#050D13" stroke="#FFE600" stroke-width="1.2"/>
  </g>
</svg>

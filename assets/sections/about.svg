<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">about - operating principles</title>
  <desc id="d">About panel. I design and ship production systems end to end: interface, API, data layer, infrastructure and automation. Most of my work sits where product engineering meets security. How I work: security first; automate the repeatable; boring infrastructure, interesting products; own the whole path; ship, measure, harden.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12242E" stroke-width="1"/>
    </pattern>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0B1820" stroke-width="0.7"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00E5FF" opacity="0.035"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A23"/><stop offset="100%" stop-color="#050D13"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-35%" y="-70%" width="170%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Space Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .live  { animation: live 2.8s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 8; animation: flow 3.2s linear infinite; }
      .rise  { animation: rise .55s ease-out both; }
      .globe-rotate { transform-box: fill-box; transform-origin: center;
                       animation: globeTurn 24s linear infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes live  { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(7px); }
                          to { opacity: 1; transform: translateY(0); } }
      @keyframes globeTurn {
        0%   { transform: scaleX(1); }
        25%  { transform: scaleX(.18); }
        50%  { transform: scaleX(-1); }
        75%  { transform: scaleX(-.18); }
        100% { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .blink, .live, .flow, .rise, .globe-rotate { animation: none; }
      }
    </style>
  </defs>
  <g class="m">
    <rect width="1200" height="500" fill="#03070A"/>
    <rect width="1200" height="500" fill="url(#grid)" opacity="0.5"/>
    <rect width="1200" height="500" fill="url(#scan)"/>
    <path d="M48 44 V20 L54 14 H142.4 L156.4 44 Z" fill="#0B1A23" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="64" y="34.76" font-size="16" fill="#00E5FF" font-weight="600" letter-spacing="1.2">~/about</text>
    <rect x="22" y="40" width="1156" height="436" rx="4" fill="#050D13" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <g stroke="#39FF14" stroke-width="2" fill="none" opacity="0.75"><path d="M1160 40 H1178 V58"/><path d="M22 458 V476 H40"/></g>
    <text x="62" y="86" font-size="16" letter-spacing="0.3"><tspan fill="#C3CDD6">I design and ship </tspan><tspan fill="#39FF14" font-weight="600">production systems</tspan><tspan fill="#C3CDD6"> end to end — interface, API,</tspan></text>
    <text x="62" y="112" font-size="16" letter-spacing="0.3"><tspan fill="#C3CDD6">data layer, infrastructure and the automation that keeps them running.</tspan></text>
    <text x="62" y="164" font-size="16" letter-spacing="0.3"><tspan fill="#C3CDD6">Most of my work sits where </tspan><tspan fill="#00E5FF" font-weight="600">product engineering meets security</tspan><tspan fill="#C3CDD6">: platforms</tspan></text>
    <text x="62" y="190" font-size="16" letter-spacing="0.3"><tspan fill="#C3CDD6">that handle real users, real payments and real data, built so that the</tspan></text>
    <text x="62" y="216" font-size="16" letter-spacing="0.3"><tspan fill="#C3CDD6">boring parts are </tspan><tspan fill="#39FF14" font-weight="600">automated</tspan><tspan fill="#C3CDD6"> and the risky parts are </tspan><tspan fill="#FFE600" font-weight="600">deliberate</tspan><tspan fill="#C3CDD6">.</tspan></text>
    <text x="62" y="248" font-size="13" fill="#00E5FF" letter-spacing="4">HOW I WORK</text>
    <rect x="218" y="243" width="960" height="1" fill="#1B3541"/>
    <rect x="62" y="274" width="213" height="172" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="62" y="274" width="213" height="2" fill="#39FF14" opacity="0.8"/>
    <g transform="translate(78 290) scale(1.0000)" fill="none" stroke="#39FF14" stroke-width="1.90" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M12 2 L21 6 v6 c0 5.4-4.2 8.6-9 10.4C7.2 20.6 3 17.4 3 12 V6 Z"/></g>
    <text x="78" y="332" font-size="11.5" fill="#39FF14" font-weight="700" letter-spacing="1.2">SECURITY</text>
    <text x="78" y="348" font-size="11.5" fill="#39FF14" font-weight="700" letter-spacing="1.2">FIRST</text>
    <text x="78" y="374" font-size="12" fill="#6E828F">Security is a design</text>
    <text x="78" y="391" font-size="12" fill="#6E828F">input, not a review</text>
    <text x="78" y="408" font-size="12" fill="#6E828F">step. Threat</text>
    <text x="78" y="425" font-size="12" fill="#6E828F">assumptions get</text>
    <text x="78" y="442" font-size="12" fill="#6E828F">written down first.</text>
    <rect x="287" y="274" width="213" height="172" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="287" y="274" width="213" height="2" fill="#FFE600" opacity="0.8"/>
    <g transform="translate(303 290) scale(1.0000)" fill="none" stroke="#FFE600" stroke-width="1.90" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M13.5 2 L5 13.5 h5.5 L9.5 22 L19 10 h-6 Z"/></g>
    <text x="303" y="332" font-size="11.5" fill="#FFE600" font-weight="700" letter-spacing="1.2">AUTOMATE THE</text>
    <text x="303" y="348" font-size="11.5" fill="#FFE600" font-weight="700" letter-spacing="1.2">REPEATABLE</text>
    <text x="303" y="374" font-size="12" fill="#6E828F">If a task happens</text>
    <text x="303" y="391" font-size="12" fill="#6E828F">twice it becomes a</text>
    <text x="303" y="408" font-size="12" fill="#6E828F">script, a pipeline</text>
    <text x="303" y="425" font-size="12" fill="#6E828F">or a bot.</text>
    <rect x="512" y="274" width="213" height="172" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="512" y="274" width="213" height="2" fill="#00E5FF" opacity="0.8"/>
    <g transform="translate(528 290) scale(1.0000)" fill="none" stroke="#00E5FF" stroke-width="1.90" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M12 2.5 L21 7.2 v9.6 L12 21.5 L3 16.8 V7.2 Z"/><path d="M3 7.2 L12 12 l9-4.8M12 12 v9.5"/></g>
    <text x="528" y="332" font-size="11.5" fill="#00E5FF" font-weight="700" letter-spacing="1.2">BORING INFRA,</text>
    <text x="528" y="348" font-size="11.5" fill="#00E5FF" font-weight="700" letter-spacing="1.2">INTERESTING PRODUCTS</text>
    <text x="528" y="374" font-size="12" fill="#6E828F">Predictable deploys</text>
    <text x="528" y="391" font-size="12" fill="#6E828F">are what make</text>
    <text x="528" y="408" font-size="12" fill="#6E828F">ambitious features</text>
    <text x="528" y="425" font-size="12" fill="#6E828F">affordable.</text>
    <rect x="737" y="274" width="213" height="172" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="737" y="274" width="213" height="2" fill="#39FF14" opacity="0.8"/>
    <g transform="translate(753 290) scale(1.0000)" fill="none" stroke="#39FF14" stroke-width="1.90" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.1" fill="#39FF14"/></g>
    <text x="753" y="332" font-size="11.5" fill="#39FF14" font-weight="700" letter-spacing="1.2">OWN THE</text>
    <text x="753" y="348" font-size="11.5" fill="#39FF14" font-weight="700" letter-spacing="1.2">WHOLE PATH</text>
    <text x="753" y="374" font-size="12" fill="#6E828F">From git init to the</text>
    <text x="753" y="391" font-size="12" fill="#6E828F">production incident</text>
    <text x="753" y="408" font-size="12" fill="#6E828F">at 2am. No handoff</text>
    <text x="753" y="425" font-size="12" fill="#6E828F">to hide behind.</text>
    <rect x="962" y="274" width="213" height="172" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="962" y="274" width="213" height="2" fill="#00E5FF" opacity="0.8"/>
    <g transform="translate(978 290) scale(1.0000)" fill="none" stroke="#00E5FF" stroke-width="1.90" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M2 12 h4 l3-7.5 l4.5 15 l3-7.5 h5.5"/></g>
    <text x="978" y="332" font-size="11.5" fill="#00E5FF" font-weight="700" letter-spacing="1.2">SHIP, MEASURE,</text>
    <text x="978" y="348" font-size="11.5" fill="#00E5FF" font-weight="700" letter-spacing="1.2">HARDEN</text>
    <text x="978" y="374" font-size="12" fill="#6E828F">Working beats</text>
    <text x="978" y="391" font-size="12" fill="#6E828F">perfect. Then perfect</text>
    <text x="978" y="408" font-size="12" fill="#6E828F">the parts that carry</text>
    <text x="978" y="425" font-size="12" fill="#6E828F">risk.</text>
  </g>
</svg>

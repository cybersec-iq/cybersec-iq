    <text x="28" y="68" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">I design and ship </tspan><tspan fill="#39FF14" font-weight="600">production</tspan></text>
    <text x="28" y="87" font-size="11.5" letter-spacing="0.1"><tspan fill="#39FF14" font-weight="600">systems</tspan><tspan fill="#C3CDD6"> end to end — interface,</tspan></text>
    <text x="28" y="106" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">API, data layer, infrastructure and</tspan></text>
    <text x="28" y="125" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">the automation that keeps them running.</tspan></text>
    <text x="28" y="163" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">Most of my work sits where </tspan></text>

    <text x="28" y="201" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">platforms that handle real users, real</tspan></text>
    <text x="28" y="220" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">payments and real data, built so the</tspan></text>
    <text x="28" y="239" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">boring parts are </tspan><tspan fill="#39FF14" font-weight="600">automated</tspan><tspan fill="#C3CDD6"> and the</tspan></text>
    <text x="28" y="258" font-size="11.5" letter-spacing="0.1"><tspan fill="#C3CDD6">risky parts are </tspan><tspan fill="#FFE600" font-weight="600">deliberate</tspan><tspan fill="#C3CDD6">.</tspan></text>
    <text x="28" y="287" font-size="12" fill="#00E5FF" letter-spacing="3">HOW I WORK</text>
    <rect x="136" y="282" width="276" height="1" fill="#1B3541"/>
    <rect x="28" y="303" width="384" height="48" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="28" y="303" width="3" height="48" fill="#39FF14" opacity="0.85"/>

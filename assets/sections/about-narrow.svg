    <text x="72" y="324" font-size="11.5" fill="#39FF14" font-weight="700" letter-spacing="0.8">SECURITY FIRST</text>
    <text x="72" y="341" font-size="10.5" fill="#6E828F">Security is a design input, not a review step.</text>
    <rect x="28" y="359" width="384" height="48" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>

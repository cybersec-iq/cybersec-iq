    <text x="72" y="380" font-size="11.5" fill="#FFE600" font-weight="700" letter-spacing="0.8">AUTOMATE THE REPEATABLE</text>
    <text x="72" y="397" font-size="10.5" fill="#6E828F">If a task happens twice it becomes a script, a</text>
    <rect x="28" y="415" width="384" height="48" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="28" y="415" width="3" height="48" fill="#00E5FF" opacity="0.85"/>
    <g transform="translate(42 428) scale(0.8333)" fill="none" stroke="#00E5FF" stroke-width="2.28" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M12 2.5 L21 7.2 v9.6 L12 21.5 L3 16.8 V7.2 Z"/><path d="M3 7.2 L12 12 l9-4.8M12 12 v9.5"/></g>
    <text x="72" y="436" font-size="11.5" fill="#00E5FF" font-weight="700" letter-spacing="0.8">BORING INFRA, INTERESTING PRODUCTS</text>
    <text x="72" y="453" font-size="10.5" fill="#6E828F">Predictable deploys are what make ambitious fe</text>
    <rect x="28" y="471" width="384" height="48" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="28" y="471" width="3" height="48" fill="#39FF14" opacity="0.85"/>
    <g transform="translate(42 484) scale(0.8333)" fill="none" stroke="#39FF14" stroke-width="2.28" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.1" fill="#39FF14"/></g>
    <text x="72" y="492" font-size="11.5" fill="#39FF14" font-weight="700" letter-spacing="0.8">OWN THE WHOLE PATH</text>
    <text x="72" y="509" font-size="10.5" fill="#6E828F">From git init to the production incident at 2a</text>
    <rect x="28" y="527" width="384" height="48" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="28" y="527" width="3" height="48" fill="#00E5FF" opacity="0.85"/>
    <g transform="translate(42 540) scale(0.8333)" fill="none" stroke="#00E5FF" stroke-width="2.28" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M2 12 h4 l3-7.5 l4.5 15 l3-7.5 h5.5"/></g>
    <text x="72" y="548" font-size="11.5" fill="#00E5FF" font-weight="700" letter-spacing="0.8">SHIP, MEASURE, HARDEN</text>
    <text x="72" y="565" font-size="10.5" fill="#6E828F">Working beats perfect. Then perfect the parts </text>

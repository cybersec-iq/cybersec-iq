<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 603" width="440" height="603" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">about - operating principles</title>
  <desc id="d">About panel. I design and ship production systems end to end: interface, API, data layer, infrastructure and automation. Most of my work sits where product engineering meets security. How I work: security first; automate the repeatable; boring infrastructure, interesting products; own the whole path; ship, measure, harden.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12242E" stroke-width="1"/>
    </pattern>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0B1820" stroke-width="0.7"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00E5FF" opacity="0.035"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A23"/><stop offset="100%" stop-color="#050D13"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-35%" y="-70%" width="170%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Space Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .live  { animation: live 2.8s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 8; animation: flow 3.2s linear infinite; }
      .rise  { animation: rise .55s ease-out both; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes live  { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(7px); }
                          to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .live, .flow, .rise { animation: none; }
      }
    </style>
  </defs>
  <g class="m">
    <rect width="440" height="603" fill="#03070A"/>
    <rect width="440" height="603" fill="url(#grid)" opacity="0.5"/>
    <rect width="440" height="603" fill="url(#scan)"/>
    <rect x="10" y="34" width="420" height="557" rx="4" fill="#050D13" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 532" width="440" height="532" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">Play Snake - snake protocol</title>
  <desc id="d">Play Snake. Interactive console. A real, playable Snake: original build, no framework, no trackers, no dependencies. Controls: arrows or WASD to move, space or P to pause, R to restart. Board 21 by 21. High score stored locally in the browser. Hosted on GitHub Pages.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12242E" stroke-width="1"/>
    </pattern>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0B1820" stroke-width="0.7"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00E5FF" opacity="0.035"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A23"/><stop offset="100%" stop-color="#050D13"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-35%" y="-70%" width="170%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Space Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .live  { animation: live 2.8s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 8; animation: flow 3.2s linear infinite; }
      .rise  { animation: rise .55s ease-out both; }
      .globe-rotate { transform-box: fill-box; transform-origin: center;
                       animation: globeTurn 24s linear infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes live  { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(7px); }
                          to { opacity: 1; transform: translateY(0); } }
      @keyframes globeTurn {
        0%   { transform: scaleX(1); }
        25%  { transform: scaleX(.18); }
        50%  { transform: scaleX(-1); }
        75%  { transform: scaleX(-.18); }
        100% { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .blink, .live, .flow, .rise, .globe-rotate { animation: none; }
      }
    </style>
  </defs>
  <g class="m">
    <rect width="440" height="532" fill="#03070A"/>
    <rect width="440" height="532" fill="url(#grid)" opacity="0.5"/>
    <rect width="440" height="532" fill="url(#scan)"/>
    <rect x="10" y="20" width="420" height="500" rx="4" fill="#050D13" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <g stroke="#FFE600" stroke-width="2" fill="none" opacity="0.85"><path d="M10 35 V20 H25"/><path d="M415 20 H430 V35"/></g>
    <text x="30" y="52" font-size="11.5" fill="#00E5FF" letter-spacing="2.6">// INTERACTIVE CONSOLE</text>
    <g transform="translate(30 64) scale(1.2500)" fill="none" stroke="#39FF14" stroke-width="1.92" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M3 18 h5 v-5 h5 v-5 h5" stroke-width="2.6"/><rect x="17.5" y="6" width="4" height="4" fill="#39FF14" stroke="none"/></g>
    <text x="72" y="96" font-size="34" fill="#39FF14" font-weight="700" letter-spacing="1.6" filter="url(#glowMd)">PLAY SNAKE</text>
    <text x="30" y="122" font-size="13" fill="#EAF2F7">Challenge the terminal.</text>
    <text x="30" y="140" font-size="13" fill="#EAF2F7">Beat the system.</text>
    <rect x="30" y="156" width="380" height="54" rx="3" fill="#04170A" fill-opacity="1.0" stroke="#39FF14" stroke-width="2"/>
    <g transform="translate(48 173.0) scale(0.8333)" fill="none" stroke="#39FF14" stroke-width="2.28" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><path d="M7 4.5 L19 12 L7 19.5 Z"/></g>
    <text x="86" y="189.0" font-size="16" fill="#39FF14" font-weight="700" letter-spacing="5.5" filter="url(#glowSm)">PLAY SNAKE</text>
    <path d="M380 176 l7 7 l-7 7" fill="none" stroke="#39FF14" stroke-width="2.2" stroke-linecap="square"/>
    <rect x="30" y="226" width="380" height="150" rx="3" fill="#020A06" fill-opacity="1.0" stroke="#39FF14" stroke-width="1.2"/>
    <g stroke="#39FF14" stroke-width="1.6" fill="none" opacity="0.6"><path d="M30 238 V226 H42"/><path d="M398 226 H410 V238"/><path d="M30 364 V376 H42"/><path d="M398 376 H410 V364"/></g>
    <g stroke="#0C3A08" stroke-width="0.7" opacity="0.5"><path d="M53.8 226 V376"/><path d="M77.5 226 V376"/><path d="M101.2 226 V376"/><path d="M125.0 226 V376"/><path d="M148.8 226 V376"/><path d="M172.5 226 V376"/><path d="M196.2 226 V376"/><path d="M220.0 226 V376"/><path d="M243.8 226 V376"/><path d="M267.5 226 V376"/><path d="M291.2 226 V376"/><path d="M315.0 226 V376"/><path d="M338.8 226 V376"/><path d="M362.5 226 V376"/><path d="M386.2 226 V376"/><path d="M30 239.6 H410"/><path d="M30 253.3 H410"/><path d="M30 266.9 H410"/><path d="M30 280.5 H410"/><path d="M30 294.2 H410"/><path d="M30 307.8 H410"/><path d="M30 321.5 H410"/><path d="M30 335.1 H410"/><path d="M30 348.7 H410"/><path d="M30 362.4 H410"/></g>
    <g fill="#39FF14"><rect x="79.0" y="336.6" width="10.6" height="10.6" opacity="0.55"/><rect x="102.8" y="336.6" width="10.6" height="10.6" opacity="0.58"/><rect x="126.5" y="336.6" width="10.6" height="10.6" opacity="0.61"/><rect x="150.2" y="336.6" width="10.6" height="10.6" opacity="0.65"/><rect x="174.0" y="336.6" width="10.6" height="10.6" opacity="0.68"/><rect x="197.8" y="336.6" width="10.6" height="10.6" opacity="0.71"/><rect x="221.5" y="336.6" width="10.6" height="10.6" opacity="0.74"/><rect x="245.2" y="336.6" width="10.6" height="10.6" opacity="0.78"/><rect x="269.0" y="336.6" width="10.6" height="10.6" opacity="0.81"/><rect x="269.0" y="323.0" width="10.6" height="10.6" opacity="0.84"/><rect x="269.0" y="309.3" width="10.6" height="10.6" opacity="0.87"/><rect x="269.0" y="295.7" width="10.6" height="10.6" opacity="0.90"/><rect x="292.8" y="295.7" width="10.6" height="10.6" opacity="0.94"/><rect x="316.5" y="295.7" width="10.6" height="10.6" opacity="0.97"/><rect x="340.2" y="295.7" width="10.6" height="10.6" opacity="1.00"/></g>
    <rect x="340.2" y="295.7" width="10.6" height="10.6" fill="#DFFF00" filter="url(#glowSm)"/>
    <rect x="150.2" y="254.8" width="10.6" height="10.6" fill="#FFE600" class="live" filter="url(#glowSm)"/>
    <text x="30" y="392" font-size="11" fill="#00E5FF" letter-spacing="2.2">// CONTROLS</text>
    <text x="30" y="414" font-size="12" fill="#00E5FF">ARROWS / WASD</text>
    <text x="220" y="414" font-size="12" fill="#C3CDD6" letter-spacing="1.2">MOVE</text>
    <text x="30" y="436" font-size="12" fill="#00E5FF">SPACE or P</text>
    <text x="220" y="436" font-size="12" fill="#C3CDD6" letter-spacing="1.2">PAUSE</text>
    <text x="30" y="458" font-size="12" fill="#00E5FF">R</text>
    <text x="220" y="458" font-size="12" fill="#C3CDD6" letter-spacing="1.2">RESTART</text>
    <text x="30" y="492" font-size="11" fill="#6E828F">Original build — no framework,</text>
    <text x="30" y="507" font-size="11" fill="#6E828F">no trackers, no dependencies.</text>
  </g>
</svg>

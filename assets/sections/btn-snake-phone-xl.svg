<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 92" width="174" height="92" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">PLAY SNAKE</title>
  <desc id="d">PLAY SNAKE. Snake Protocol console</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12242E" stroke-width="1"/>
    </pattern>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0B1820" stroke-width="0.7"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00E5FF" opacity="0.035"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A23"/><stop offset="100%" stop-color="#050D13"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-35%" y="-70%" width="170%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Space Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .live  { animation: live 2.8s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 8; animation: flow 3.2s linear infinite; }
      .rise  { animation: rise .55s ease-out both; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes live  { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(7px); }
                          to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .live, .flow, .rise { animation: none; }
      }
    </style>
  </defs>
  <g class="m">
    <rect x="1" y="1" width="172" height="90" rx="3" fill="#08141C" fill-opacity="1.0" stroke="#FFE600" stroke-width="1.5"/>
    <rect x="1" y="1" width="4" height="90" fill="#FFE600" opacity="0.9"/>
    <g stroke="#FFE600" stroke-width="1.6" fill="none" opacity="0.5"><path d="M1 10 V1 H10"/><path d="M164 91 H173 V82"/></g>
    <g transform="translate(12 11) scale(0.7083)" fill="none" stroke="#FFE600" stroke-width="2.68" stroke-linecap="square" stroke-linejoin="miter" vector-effect="non-scaling-stroke"><rect x="2.5" y="7" width="19" height="10.5" rx="4"/><path d="M7 10.4 v3.7M5.2 12.2 h3.7"/><circle cx="16.2" cy="11.4" r="1.1" fill="#FFE600"/><circle cx="18.4" cy="13.8" r="1.1" fill="#FFE600"/></g>
    <path d="M154 13 l6 6 l-6 6" fill="none" stroke="#FFE600" stroke-width="2" stroke-linecap="square" opacity="0.85"/>
    <text x="12" y="49.0" font-size="12.5" fill="#FFE600" font-weight="700" letter-spacing="0.5">PLAY SNAKE</text>
    <text x="12" y="69" font-size="9" fill="#6E828F" letter-spacing="0">Snake Protocol console</text>
  </g>
</svg>

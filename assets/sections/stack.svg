  <title id="t">stack - technology system map</title>
  <desc id="d">Technology stack. Frontend: React, Next.js, TypeScript, JavaScript. Backend: Node.js, Python, REST APIs. Data: PostgreSQL. Infrastructure: Docker, Linux, Git, GitHub Actions. Security practice: secure SDLC, threat modelling, dependency hygiene, hardening. Tools and automation: GitHub Actions, CI/CD pipelines, automation bots.</desc>

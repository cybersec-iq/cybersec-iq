    <circle cx="42" cy="54.0" r="4.2" fill="#FEBC2E"/>
    <circle cx="56" cy="54.0" r="4.2" fill="#28C840"/>
    <text x="72" y="57.57" font-size="10.5" fill="#C3CDD6" letter-spacing="0.35">bash — cybersec-iq — 96×24</text>
    <circle cx="358.7" cy="54.0" r="3.4" fill="#39FF14" class="live"/>
    <text x="368.7" y="57.57" font-size="10.5" fill="#39FF14" font-weight="600" letter-spacing="1.5" filter="url(#glowSm)">ONLINE</text>
    <rect x="10" y="74" width="420" height="1" fill="#284653"/>
    <text x="28" y="103" font-size="11.4" fill="#39FF14" font-weight="600">╭─(cybersec-iq ◉ github)-[ ~/profile ]</text>
    <text x="28" y="126" font-size="12" fill="#39FF14" font-weight="600">╰─$</text>
    <text x="66" y="126" font-size="12" fill="#EAF2F7" font-weight="600">whoami</text>
    <text x="28" y="188" font-size="42" fill="#39FF14" font-weight="700" letter-spacing="1.8" filter="url(#glowMd)">ARYAN</text>
    <text x="175.2" y="188" font-size="42" fill="#48FF24" font-weight="700" letter-spacing="1.8" filter="url(#glowMd)">IQ</text>
    <text x="28" y="216" font-size="10.7" fill="#C3CDD6" letter-spacing="0.45">FULL-STACK DEVELOPER / CYBERSECURITY</text>
    <text x="28" y="234" font-size="10.7" fill="#C3CDD6" letter-spacing="0.45">/ AI SYSTEMS BUILDER</text>
    <rect x="28" y="250" width="220" height="1.3" fill="url(#ruleGreen)"/>
    <text x="28" y="286" font-size="11.8" fill="#00E5FF" letter-spacing="1.3">LOCATION</text>
    <text x="118" y="286" font-size="11.8" fill="#3A4C58">:</text>
    <text x="136" y="286" font-size="11.8" fill="#EAF2F7" font-weight="600" letter-spacing="0.45">MUSCAT, OMAN</text>
    <text x="28" y="320" font-size="11.8" fill="#00E5FF" letter-spacing="1.3">STATUS</text>
    <text x="118" y="320" font-size="11.8" fill="#3A4C58">:</text>
    <text x="136" y="320" font-size="11.8" fill="#FFE600" font-weight="600" letter-spacing="0.45">BUILDING</text>
    <circle cx="208.79" cy="316" r="3.5" fill="#FFE600" class="live"/>
    <text x="28" y="354" font-size="11.8" fill="#00E5FF" letter-spacing="1.3">MISSION</text>
    <text x="118" y="354" font-size="11.8" fill="#3A4C58">:</text>
    <text x="136" y="354" font-size="11.8" fill="#39FF14" font-weight="600" letter-spacing="0.45">NOTHING IS IMPOSSIBLE</text>
    <rect x="28" y="375" width="384" height="1" fill="#12242E"/>
    <circle cx="220.0" cy="455" r="64" fill="#020A0E" fill-opacity=".45" stroke="#1B7A10" stroke-width="1.1" opacity="0.75"/>    <g class="globe-rotate" fill="none" stroke="#1B7A10" stroke-width="1" opacity="0.75"><ellipse cx="220.0" cy="455" rx="21.8" ry="64"/><ellipse cx="220.0" cy="455" rx="43.5" ry="64"/><path d="M169.8 415.3 A 50.2 14.1 0 0 0 270.2 415.3"/><path d="M158.6 437.1 A 61.4 17.2 0 0 0 281.4 437.1"/><path d="M158.6 472.9 A 61.4 17.2 0 0 0 281.4 472.9"/><path d="M169.8 494.7 A 50.2 14.1 0 0 0 270.2 494.7"/><path d="M182.9 443.5 Q220.0 447.3 205.9 421.7" stroke="#0A6C7C" stroke-opacity=".72"/><path d="M205.9 421.7 Q220.0 447.3 231.5 439.6" stroke="#0A6C7C" stroke-opacity=".72"/><path d="M231.5 439.6 Q220.0 447.3 255.8 425.6" stroke="#0A6C7C" stroke-opacity=".72"/><path d="M255.8 425.6 Q220.0 447.3 259.7 467.8" stroke="#0A6C7C" stroke-opacity=".72"/><path d="M259.7 467.8 Q220.0 447.3 231.5 485.7" stroke="#0A6C7C" stroke-opacity=".72"/><path d="M231.5 485.7 Q220.0 447.3 193.1 476.8" stroke="#0A6C7C" stroke-opacity=".72"/></g>    <g class="globe-rotate" fill="#00E5FF"><circle cx="198" cy="436" r="2.6" class="live" style="animation-delay:-0.0s"/><circle cx="234" cy="447" r="2.6" class="live" style="animation-delay:-0.5s"/><circle cx="246" cy="473" r="2.6" class="live" style="animation-delay:-1.0s"/><circle cx="208" cy="482" r="2.6" class="live" style="animation-delay:-1.5s"/><circle cx="223" cy="420" r="2.6" class="live" style="animation-delay:-2.0s"/></g>
    <text x="220.0" y="541" font-size="10.5" fill="#00E5FF" letter-spacing="1.4" text-anchor="middle">MUSCAT, OMAN</text>
    <rect x="28" y="589" width="384" height="1" fill="#1B3541"/>
    <rect x="28" y="589" width="184.32" height="1" fill="#1B7A10"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 432" width="440" height="432" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
  <title id="t">whoami - Aryan IQ</title>
  <desc id="d">Terminal identity panel. Prompt cybersec-iq at github, tilde profile, command whoami. Output ARYAN IQ. Full-stack developer, cybersecurity, AI systems builder. Location Muscat, Oman. Status building. Mission nothing is impossible.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#12242E" stroke-width="1"/>
    </pattern>
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#0B1820" stroke-width="0.7"/>
    </pattern>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#00E5FF" opacity="0.035"/>
    </pattern>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A23"/><stop offset="100%" stop-color="#050D13"/>
    </linearGradient>
    <linearGradient id="ruleGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSm" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMd" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLg" x="-35%" y="-70%" width="170%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type-whoami-narrow">
      <rect x="66" y="128" width="43.8" height="16.2">
        <animate attributeName="width" values="43.8;43.8;0.0;0.0;7.3;14.6;21.9;29.2;36.5;43.8;43.8;43.8;43.8" keyTimes="0.000;0.010;0.011;0.080;0.088;0.096;0.104;0.112;0.120;0.128;0.780;0.960;1.000" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", "Space Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .live  { animation: live 2.8s ease-in-out infinite; }
      .flow  { stroke-dasharray: 4 8; animation: flow 3.2s linear infinite; }
      .rise  { animation: rise .55s ease-out both; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes live  { 0%,100% { opacity: .38; } 50% { opacity: 1; } }
      @keyframes flow  { to { stroke-dashoffset: -24; } }
      @keyframes rise  { from { opacity: 0; transform: translateY(7px); }
                          to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .blink, .live, .flow, .rise { animation: none; }
      }
    </style>
  </defs>
  <g class="m">
    <rect width="440" height="432" fill="#03070A"/>
    <rect width="440" height="432" fill="url(#grid)" opacity="0.5"/>
    <rect width="440" height="432" fill="url(#scan)"/>
    <text x="11" y="23" font-size="13.5" fill="#00E5FF" font-weight="600" letter-spacing="0.3">~/whoami</text>
    <rect x="10" y="34" width="420" height="364" rx="4" fill="#050D13" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.2"/>
    <rect x="10" y="34" width="420" height="40" rx="3" fill="#0B1A23" fill-opacity="1.0" stroke="#1B3541" stroke-width="1.1"/>
    <circle cx="28" cy="54.0" r="4.2" fill="#FF5F57"/>
    <circle cx="42" cy="54.0" r="4.2" fill="#FEBC2E"/>
    <circle cx="56" cy="54.0" r="4.2" fill="#28C840"/>
    <text x="72" y="57.57" font-size="10.5" fill="#C3CDD6" letter-spacing="0.35">bash — cybersec-iq — 96×24</text>
    <circle cx="358.7" cy="54.0" r="3.4" fill="#39FF14" class="live"/>
    <text x="368.7" y="57.57" font-size="10.5" fill="#39FF14" font-weight="600" letter-spacing="1.5" filter="url(#glowSm)">ONLINE</text>
    <rect x="10" y="74" width="420" height="1" fill="#284653"/>
    <text x="28" y="116" font-size="11.4" fill="#39FF14" font-weight="600">╭─(cybersec-iq ◉ github)-[ ~/profile ]</text>
    <text x="28" y="140" font-size="12" fill="#39FF14" font-weight="600">╰─$</text>
    <text x="66" y="140" font-size="12" fill="#EAF2F7" font-weight="600" letter-spacing="0.1" style="clip-path:url(#type-whoami-narrow)">whoami</text>
    <rect x="113.8" y="130.0" width="5.8" height="12.6" fill="#39FF14" class="blink" filter="url(#glowSm)"><animate attributeName="x" values="109.8;109.8;66.0;66.0;73.3;80.6;87.9;95.2;102.5;109.8;109.8;109.8;109.8" keyTimes="0.000;0.010;0.011;0.080;0.088;0.096;0.104;0.112;0.120;0.128;0.780;0.960;1.000" dur="12s" calcMode="discrete" repeatCount="indefinite"/></rect>
    <text x="28" y="202" font-size="40" fill="#39FF14" font-weight="700" letter-spacing="1.8" filter="url(#glowMd)">ARYAN</text>
    <text x="169.2" y="202" font-size="40" fill="#48FF24" font-weight="700" letter-spacing="1.8" filter="url(#glowMd)">IQ</text>
    <text x="28" y="230" font-size="10.7" fill="#C3CDD6" letter-spacing="0.45">FULL-STACK DEVELOPER / CYBERSECURITY</text>
    <text x="28" y="248" font-size="10.7" fill="#C3CDD6" letter-spacing="0.45">/ AI SYSTEMS BUILDER</text>
    <rect x="28" y="266" width="272" height="1.3" fill="url(#ruleGreen)"/>
    <text x="28" y="292" font-size="11.8" fill="#00E5FF" letter-spacing="1.3">LOCATION</text>
    <text x="102" y="292" font-size="11.8" fill="#3A4C58">:</text>
    <text x="116" y="292" font-size="11.8" letter-spacing="0.45" xml:space="preserve"><tspan fill="#EAF2F7" font-weight="600">MUSCAT, OMAN</tspan></text>
    <text x="28" y="326" font-size="11.8" fill="#00E5FF" letter-spacing="1.3">STATUS</text>
    <text x="102" y="326" font-size="11.8" fill="#3A4C58">:</text>
    <text x="116" y="326" font-size="11.8" letter-spacing="0.45" xml:space="preserve"><tspan fill="#FFE600" font-weight="600">BUILDING</tspan><tspan fill="#FFE600" font-weight="600">  ●</tspan></text>
    <text x="28" y="360" font-size="11.8" fill="#00E5FF" letter-spacing="1.3">MISSION</text>
    <text x="102" y="360" font-size="11.8" fill="#3A4C58">:</text>
    <text x="116" y="360" font-size="11.8" letter-spacing="0.45" xml:space="preserve"><tspan fill="#39FF14" font-weight="600">NOTHING IS IMPOSSIBLE</tspan></text>
    <rect x="28" y="419" width="384" height="1" fill="#1B3541"/>
    <rect x="28" y="419" width="184.32" height="1" fill="#1B7A10"/>
    <rect x="227.68" y="419" width="184.32" height="1" fill="#0A6C7C"/>
    <rect x="215.0" y="414" width="10" height="10" transform="rotate(45 220.0 419)" fill="#050D13" stroke="#FFE600" stroke-width="1.2"/>
  </g>
</svg>
